name: Windows portable

# Dedicated packaging workflow: builds the Windows app and packs it into a
# single-file portable exe with NSIS (tool/portable.nsi). Account data still
# goes to the per-user data directory.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Read by default; only the jobs that attach release assets widen it.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  portable:
    name: Single-file exe
    permissions:
      contents: write   # attaches the portable exe to the Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Keep GITHUB_TOKEN out of .git/config: it would otherwise be
          # readable by every later step in the job, and the release attach
          # step gets its credential from the action's own env instead.
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      # NSIS is NOT in the windows-latest (Server 2025) image — it was in
      # 2022, which is what an out-of-date reading of the image manifest will
      # tell you. Install it from Chocolatey at a pinned version: choco is on
      # the image and verifies the package checksum itself, so this is still
      # a long way from the unversioned, undigested vendor download it
      # replaced — but it is a download, and the comment should say so.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis exited $LASTEXITCODE" }

      # See tool/portable.nsi for why the installer job cannot use this.
      - name: Pack single-file exe
        shell: pwsh
        working-directory: .
        run: |
          $src = (Resolve-Path app/build/windows/x64/runner/Release).Path
          $out = Join-Path (Get-Location).Path "AVA-v${{ steps.ver.outputs.v }}-windows-x64-portable.exe"
          $ico = (Resolve-Path app/windows/runner/resources/app_icon.ico).Path
          # choco does not refresh this session's PATH, so look in the known
          # install location too before giving up.
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          foreach ($c in @("${env:ProgramFiles(x86)}\NSIS\makensis.exe",
                           "${env:ProgramFiles}\NSIS\makensis.exe")) {
            if (-not $makensis -and (Test-Path $c)) { $makensis = $c }
          }
          if (-not $makensis) { throw "makensis not found after installing NSIS" }
          & $makensis /VERSION
          & $makensis /V2 "/DSRCDIR=$src" "/DOUTFILE=$out" "/DICONFILE=$ico" `
            "/DAPPVER=${{ steps.ver.outputs.v }}" tool/portable.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis exited $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw "makensis produced no output" }
          "packed {0:N1} MB" -f ((Get-Item $out).Length / 1MB)

      - name: Smoke test
        shell: pwsh
        working-directory: .
        run: |
          Start-Process "AVA-v${{ steps.ver.outputs.v }}-windows-x64-portable.exe"
          Start-Sleep 12
          # The outer stub stays alive only because it is ExecWait-ing on the
          # app, so its survival is already evidence the app launched...
          $outer = Get-Process "AVA-v${{ steps.ver.outputs.v }}-windows-x64-portable" -ErrorAction SilentlyContinue
          if (-not $outer) { throw 'packed exe did not stay running' }
          # ...but assert the unpacked app directly too, so a stub that hangs
          # for its own reasons cannot pass for a working build.
          $inner = Get-Process ava -ErrorAction SilentlyContinue
          if (-not $inner) { throw 'the unpacked ava.exe never started' }
          $inner | Stop-Process -Force
          $outer | Stop-Process -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: AVA-v${{ steps.ver.outputs.v }}-windows-x64-portable
          path: AVA-v${{ steps.ver.outputs.v }}-windows-x64-portable.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: AVA-v${{ steps.ver.outputs.v }}-windows-x64-portable.exe
