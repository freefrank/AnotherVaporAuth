name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # --enforce-lockfile: a bare `pub get` silently re-resolves and upgrades
      # when the lockfile is missing or stale. That is how a transitive `jni`
      # bump reached main on 2026-07-26 and broke `bundlePlayRelease` while
      # analyze and test stayed green — neither of them touches Android Gradle.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze

      # pipefail is mandatory here: without it the pipeline reports tee's exit
      # code and a failing suite would pass CI.
      - name: Test
        run: |
          set -o pipefail
          flutter test | tee ../test-output.txt

      # The installer and the entitlement worker had no CI coverage at all
      # until 2026-07-30, so the guards added with them — manifest-scoped
      # uninstall, the purchase-token binding — could have rotted unnoticed.
      - name: Installer tests
        working-directory: installer
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile
          flutter test

      - name: Entitlement worker tests
        working-directory: infra/entitlement-worker
        run: |
          set -o pipefail
          npm ci
          npm run typecheck
          npm test

      - name: Lint the docs against reality
        working-directory: .
        run: |
          # flutter picks a different reporter under GitHub Actions
          # ("🎉 545 tests passed.") than it does locally
          # ("00:25 +545: All tests passed!"). Accept either.
          count=$(grep -oE '(\+[0-9]+: All tests passed|[0-9]+ tests? passed)' \
                  test-output.txt | grep -oE '[0-9]+' | tail -1)
          if [ -z "$count" ]; then
            echo "::error::could not read the test count from test-output.txt"
            tail -5 test-output.txt
            exit 1
          fi
          echo "suite has $count tests"
          python3 tool/docs_lint.py "$count"
