name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # --enforce-lockfile: a bare `pub get` silently re-resolves and upgrades
      # when the lockfile is missing or stale. That is how a transitive `jni`
      # bump reached main on 2026-07-26 and broke `bundlePlayRelease` while
      # analyze and test stayed green — neither of them touches Android Gradle.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test | tee ../test-output.txt

      - name: Lint the docs against reality
        working-directory: .
        run: |
          count=$(grep -oE '\+[0-9]+: All tests passed' test-output.txt \
                  | grep -oE '[0-9]+' | tail -1)
          echo "suite has ${count:-0} tests"
          python3 tool/docs_lint.py "${count:-0}"
