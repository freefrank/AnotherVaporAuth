name: Desktop release

# Manual dispatch builds the Windows folder + Linux AppImage as artifacts.
# Pushing a v* tag additionally attaches both (zip / AppImage) to the GitHub
# Release with notes extracted from CHANGELOG.md.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Read by default; only the jobs that attach release assets widen it.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  windows:
    name: Windows x64
    permissions:
      contents: write   # attaches the setup exe to the Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Keep GITHUB_TOKEN out of .git/config: every later step in the
          # job — including the third-party installer this workflow
          # downloads and runs — would otherwise inherit push access.
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      # ---- scene-style installer (installer/): app Release becomes the
      # payload asset, the installer app is built around it, then Enigma
      # packs the whole thing into one setup exe. ----
      - name: Embed payload
        shell: pwsh
        working-directory: .
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath installer/assets/payload.zip -Force
          $size = (Get-Item installer/assets/payload.zip).Length
          if ($size -lt 10MB) { throw "payload.zip suspiciously small ($size bytes) — refusing to ship a placeholder installer" }

      - name: Build installer app
        working-directory: installer
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release --dart-define=AVA_VERSION=${{ steps.ver.outputs.v }}

      - name: Install Enigma Virtual Box
        shell: pwsh
        working-directory: .
        run: |
          $out = "$env:TEMP\enigmavb.exe"
          foreach ($i in 1..3) {
            curl.exe -sL -o $out https://enigmaprotector.com/assets/files/enigmavb.exe
            if ((Get-Item $out -ErrorAction SilentlyContinue).Length -gt 5MB) { break }
            Start-Sleep 5
          }
          if ((Get-Item $out).Length -le 5MB) { throw 'enigmavb.exe download failed/truncated' }

          # This installer runs with the job's credentials and its output is
          # what users execute, so "it downloaded" is not good enough. The
          # vendor publishes no digest and the URL is unversioned, so a pinned
          # SHA-256 would break on every upstream release; the Authenticode
          # signature is the control that survives version bumps.
          $sig = Get-AuthenticodeSignature $out
          if ($sig.Status -ne 'Valid') {
            throw "enigmavb.exe signature is $($sig.Status) — refusing to run it"
          }
          $subject = $sig.SignerCertificate.Subject
          if ($subject -notmatch 'Enigma') {
            throw "enigmavb.exe signed by an unexpected publisher: $subject"
          }
          Write-Host "enigmavb.exe signature OK — $subject"
          Start-Process $out -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait

      - name: Pack single-file setup exe
        shell: pwsh
        working-directory: .
        run: ./tool/pack_portable.ps1 -ReleaseDir installer/build/windows/x64/runner/Release -Output "AVA-v${{ steps.ver.outputs.v }}-windows-x64-setup.exe" -ExeName ava_installer.exe -NoTempMap

      - name: E2E install test
        shell: pwsh
        working-directory: .
        run: |
          $p = Start-Process ".\AVA-v${{ steps.ver.outputs.v }}-windows-x64-setup.exe" -ArgumentList '--auto' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "auto-install exited $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\AVA"
          foreach ($f in @('ava.exe','uninstall.exe','data\icudtl.dat')) {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f after install" }
          }
          reg query HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\AVA /v UninstallString

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: AVA-v${{ steps.ver.outputs.v }}-windows-x64-setup
          path: AVA-v${{ steps.ver.outputs.v }}-windows-x64-setup.exe

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        working-directory: .
        env:
          # Match the version read from pubspec, NOT the tag. Tags are
          # v<MAJOR.MINOR> (v1.0) while CHANGELOG headings carry the full
          # version (## [v1.0.0]), so "## [" + tag + "]" matched nothing and
          # fell through to the bare-tag fallback. v0.84 / v0.92 / v0.94 /
          # v1.0 all shipped with an empty "Release vX" body because of it;
          # v0.80.1 looked fine only because that tag happened to be
          # three-part.
          CHANGELOG_VERSION: v${{ steps.ver.outputs.v }}
        run: |
          awk -v ver="$CHANGELOG_VERSION" '
            index($0, "## [" ver "]")==1 {p=1; print; next}
            /^## \[/ {p=0}
            p {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          if [ ! -s "$RUNNER_TEMP/RELEASE_NOTES.md" ]; then
            # Keep the fallback, but never let it be invisible again: four
            # releases went out with useless notes and nothing said so.
            echo "::warning::CHANGELOG.md has no '## [$CHANGELOG_VERSION]' section — release notes fall back to the bare tag name."
            echo "Release $GITHUB_REF_NAME" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          echo "path=$RUNNER_TEMP/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: AVA-v${{ steps.ver.outputs.v }}-windows-x64-setup.exe
          body_path: ${{ steps.notes.outputs.path }}

  linux-appimage:
    name: Linux AppImage
    permissions:
      contents: write   # attaches the AppImage to the Release
    # 24.04: Flutter 3.44's Linux build passes clang≥17-only warning flags
    # (-Wno-deprecated-literal-operator), which 22.04's clang 14 rejects.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Keep GITHUB_TOKEN out of .git/config: every later step in the
          # job — including the third-party installer this workflow
          # downloads and runs — would otherwise inherit push access.
          persist-credentials: false

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libjsoncpp-dev
        working-directory: .

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release

      - name: Read version
        id: ver
        run: echo "v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp assets/icon/icon_neon.png AppDir/ava.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ava" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/ava.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AVA
          Comment=AnotherVaporAuth — Steam authenticator
          Exec=ava
          Icon=ava
          Categories=Utility;Security;
          Terminal=false
          EOF
          # Pinned release + digest, not `continuous`. This binary runs with
          # the job's credentials and its output is what users install, so a
          # moving download is a direct path into every AppImage we ship.
          # Bump both lines together; the digest is on the release asset.
          curl -sL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' \
            | sha256sum -c -
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage
          path: app/AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        working-directory: .
        env:
          # Match the version read from pubspec, NOT the tag. Tags are
          # v<MAJOR.MINOR> (v1.0) while CHANGELOG headings carry the full
          # version (## [v1.0.0]), so "## [" + tag + "]" matched nothing and
          # fell through to the bare-tag fallback. v0.84 / v0.92 / v0.94 /
          # v1.0 all shipped with an empty "Release vX" body because of it;
          # v0.80.1 looked fine only because that tag happened to be
          # three-part.
          CHANGELOG_VERSION: v${{ steps.ver.outputs.v }}
        run: |
          awk -v ver="$CHANGELOG_VERSION" '
            index($0, "## [" ver "]")==1 {p=1; print; next}
            /^## \[/ {p=0}
            p {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          if [ ! -s "$RUNNER_TEMP/RELEASE_NOTES.md" ]; then
            # Keep the fallback, but never let it be invisible again: four
            # releases went out with useless notes and nothing said so.
            echo "::warning::CHANGELOG.md has no '## [$CHANGELOG_VERSION]' section — release notes fall back to the bare tag name."
            echo "Release $GITHUB_REF_NAME" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          echo "path=$RUNNER_TEMP/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: app/AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage
          body_path: ${{ steps.notes.outputs.path }}

  macos-dmg:
    name: macOS DMG (arm64)
    permissions:
      contents: write   # attaches the DMG to the Release
    # macos-14 runners are Apple Silicon; this job ships arm64 only
    # (2026-08-14 decision — no Intel build, no universal binary).
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get --enforce-lockfile

      - name: Read version
        id: ver
        run: echo "v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - run: flutter build macos --release --dart-define=AVA_VERSION=${{ steps.ver.outputs.v }}

      # Flutter ad-hoc signs release builds (CODE_SIGN_IDENTITY="-"). On Apple
      # Silicon an unsigned binary will not launch AT ALL, so the ad-hoc
      # signature is load-bearing — verify it survived the build rather than
      # find out from a user. (Ad-hoc ≠ notarized: Gatekeeper still warns on
      # first launch; the README documents the bypass.)
      - name: Verify the ad-hoc signature
        run: |
          APP="build/macos/Build/Products/Release/ava.app"
          test -d "$APP" || { echo "::error::$APP missing"; exit 1; }
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" \
            || { echo "::error::expected an ad-hoc signature"; exit 1; }

      # hdiutil over create-dmg/npx on purpose: it ships with macOS, so the
      # release path downloads nothing at build time. This workflow already
      # lost days to a pack step that fetched a tool from the network
      # (Enigma, then NSIS-not-on-runner) — the pretty icon layout create-dmg
      # adds is not worth reintroducing that failure mode.
      - name: Pack DMG
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "build/macos/Build/Products/Release/ava.app" "$STAGE/AVA.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "AVA" -srcfolder "$STAGE" -ov -format UDZO \
            "AVA-v${{ steps.ver.outputs.v }}-macos-arm64.dmg"
          # A DMG below a few MB means an empty staging dir shipped.
          size=$(stat -f%z "AVA-v${{ steps.ver.outputs.v }}-macos-arm64.dmg")
          [ "$size" -gt 5000000 ] || { echo "::error::DMG suspiciously small ($size bytes)"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: AVA-v${{ steps.ver.outputs.v }}-macos-arm64.dmg
          path: app/AVA-v${{ steps.ver.outputs.v }}-macos-arm64.dmg

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        working-directory: .
        env:
          # Match the version read from pubspec, NOT the tag — see the same
          # step in the windows job for the four releases this cost.
          CHANGELOG_VERSION: v${{ steps.ver.outputs.v }}
        run: |
          awk -v ver="$CHANGELOG_VERSION" '
            index($0, "## [" ver "]")==1 {p=1; print; next}
            /^## \[/ {p=0}
            p {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          if [ ! -s "$RUNNER_TEMP/RELEASE_NOTES.md" ]; then
            echo "::warning::CHANGELOG.md has no '## [$CHANGELOG_VERSION]' section — release notes fall back to the bare tag name."
            echo "Release $GITHUB_REF_NAME" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          echo "path=$RUNNER_TEMP/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: app/AVA-v${{ steps.ver.outputs.v }}-macos-arm64.dmg
          body_path: ${{ steps.notes.outputs.path }}
