name: Desktop release

# Manual dispatch builds the Windows folder + Linux AppImage as artifacts.
# Pushing a v* tag additionally attaches both (zip / AppImage) to the GitHub
# Release with notes extracted from CHANGELOG.md.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      # The artifact is the bare Release folder: GitHub wraps artifacts in one
      # zip on download, so uploading a pre-zipped file would nest two layers.
      - uses: actions/upload-artifact@v4
        with:
          name: AVA-v${{ steps.ver.outputs.v }}-windows-x64
          path: app/build/windows/x64/runner/Release/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "AVA-v${{ steps.ver.outputs.v }}-windows-x64.zip"

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        working-directory: .
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]")==1 {p=1; print; next}
            /^## \[/ {p=0}
            p {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          [ -s "$RUNNER_TEMP/RELEASE_NOTES.md" ] || echo "Release $GITHUB_REF_NAME" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          echo "path=$RUNNER_TEMP/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/AVA-v${{ steps.ver.outputs.v }}-windows-x64.zip
          body_path: ${{ steps.notes.outputs.path }}

  linux-appimage:
    name: Linux AppImage
    # Oldest supported LTS runner => oldest glibc => widest AppImage compat.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libjsoncpp-dev
        working-directory: .

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Read version
        id: ver
        run: echo "v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp assets/icon/icon_neon.png AppDir/ava.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ava" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/ava.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AVA
          Comment=AnotherVaporAuth — Steam authenticator
          Exec=ava
          Icon=ava
          Categories=Utility;Security;
          Terminal=false
          EOF
          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage
          path: app/AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        working-directory: .
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]")==1 {p=1; print; next}
            /^## \[/ {p=0}
            p {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          [ -s "$RUNNER_TEMP/RELEASE_NOTES.md" ] || echo "Release $GITHUB_REF_NAME" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          echo "path=$RUNNER_TEMP/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/AVA-v${{ steps.ver.outputs.v }}-linux-x86_64.AppImage
          body_path: ${{ steps.notes.outputs.path }}
